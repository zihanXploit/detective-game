name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  # So the workflow can be tried from the Actions tab before a pull request exists.
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Nothing here reaches a database: the app reads its configuration lazily and
      # every page that queries one is rendered per request, not at build time.
      # These exist only so configuration validation has something valid to read.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SESSION_SECRET: continuous-integration-placeholder-secret-value
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The typecheck needs the generated Prisma client. Its postinstall hook
      # usually produces it, but whether lifecycle scripts run varies by npm
      # version, so ask for it outright. Generating twice costs a second.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A throwaway database for the run. The suite refuses to touch one whose
    # name does not contain "test", so this name is load-bearing.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: detective
          POSTGRES_PASSWORD: detective
          POSTGRES_DB: detective_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U detective"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://detective:detective@localhost:5432/detective_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npx prisma generate

      # Migrates the throwaway database, starts the real server and plays
      # through the game over real sockets.
      - name: Integration tests
        run: npm run test:integration
